<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>VSnoahVS | Bio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 18px; font-family: Arial, Helvetica, sans-serif;
      color: #111; background: #fff;
    }
    main { width: min(100%, 430px); text-align: center; }
    .avatar {
      width: 88px; height: 88px; margin: 0 auto 14px; display: grid;
      place-items: center; border-radius: 50%; background: #f1f1f1;
      border: 1px solid #e5e5e5; font-size: 28px; font-weight: 800;
    }
    h1 { margin: 8px 0 18px; font-size: 29px; }
    .welcome {
      display: inline-block; position: relative; margin: 0 auto 25px;
      padding: 11px 18px; border-radius: 22px; background: #f4f4f4;
      border: 1px solid #e7e7e7; color: #111; font-size: 14px;
      font-weight: 700;
    }
    .welcome::after {
      content: ""; position: absolute; left: 50%; bottom: -7px;
      width: 13px; height: 13px; background: #f4f4f4;
      border-right: 1px solid #e7e7e7; border-bottom: 1px solid #e7e7e7;
      transform: translateX(-50%) rotate(45deg);
    }
    .links { display: grid; gap: 13px; }
    .links a {
      display: block; padding: 16px 18px; border-radius: 14px;
      background: #fff; color: #111; text-decoration: none;
      font-size: 16px; font-weight: 700; border: 1px solid #dedede;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      transition: transform .15s, box-shadow .15s;
    }
    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.10);
    }
    footer { margin-top: 25px; color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar">VS</div>
    <h1>VSnoahVS</h1>
    <div class="welcome">Seja bem-vindo! 👋</div>

    <nav class="links" aria-label="Meus links">
      <!-- Substitua os endereços pelos seus links pessoais. -->
      <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">TikTok ↗</a>
      <a href="https://www.mediafire.com/file/5p2fbir6efq84z7/Terraria-bynoah.apks/file" target="_blank" rel="noopener noreferrer">Terraria by Noah ↗</a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
      <a href="https://discord.com/" target="_blank" rel="noopener noreferrer">Discord ↗</a>
    </nav>

    <footer>VSnoahVS • Meus links</footer>
  </main>
</body>
</html>
